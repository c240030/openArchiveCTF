<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phaser Breakout</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 20% 20%, #0f172a 0, #0b0f18 45%, #06080f 100%);
      color: #e6edf3;
      font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 18px 0 6px;
      letter-spacing: 0.03em;
      font-weight: 700;
    }
    #game-container {
      margin-top: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      overflow: hidden;
    }
    .hud {
      margin: 12px 0 18px;
      opacity: 0.9;
      max-width: 880px;
      line-height: 1.4;
    }
    a {
      color: #8be9fd;
    }
  </style>
</head>
<body>
  <h1>Breakout</h1>
  <div id="game-container"></div>
  <div class="hud">
    <p>Move the paddle with the arrow or A/D keys. Press Space to launch the ball. Clear every brick to win!</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
